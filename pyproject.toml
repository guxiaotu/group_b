[project]
name = "group-b"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
    "pyrefly>=0.60.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "sqlmodel>=0.0.42",
]

[tool.fastapi]
entrypoint = "main:app"

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "sqlacodegen>=4.0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-s"
